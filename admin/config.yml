              preglednika. Pomoću njih mrežna mjesta pohranjuju privremene
              podatke, poput npr. posljednjih nekoliko stranica koje ste
              otvorili na mrežnom mjestu koje posjećujete., key: 40d01ef1
            label: Text
            name: 40d01ef1
            widget: text
