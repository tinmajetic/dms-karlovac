          - hint: 'Original text: ‍, key: 200d'
            label: Text
            name: 200d
            widget: string
          - hint: >-
              Original text: Kolačići su male datoteke koje se sastoje od slova
              i brojeva koje se preuzimaju na Vaše računalo ili mobilni uređaj
              kad posjetite internetske stranice. Pohranjuju se putem Vašeg
              internetskog preglednika na Vaš uređaj. Kolačići omogućuju
              internetskim stranicama pohranu određenih podataka kako bi se
              omogućilo jednostavnije i brže pregledavanje internetskih
              stranica, omogućavaju Vam efikasnu navigaciju kroz mrežna mjesta,
              pamte Vaše željene postavke i općenito poboljšavaju korisničko
              iskustvo. Treba napomenuti da naš website funkcionira optimalno
              samo ako je omogućeno korištenje kolačića., key: 5eac08f4
            label: Text
            name: 5eac08f4
            widget: text
          - hint: 'Original text: Korištenje kolačića (cookies), key: ea00b5f'
            label: Text
            name: ea00b5f
            widget: string
          - hint: >-
              Original text: Sukladno UREDBI (EU) 2016/679 EUROPSKOG PARLAMENTA
              I VIJEĆA o zaštiti pojedinaca u vezi s obradom osobnih podataka i
              o slobodnom kretanju takvih podataka (Općoj uredbi o zaštiti
              podataka), Zakonu o provedbi Opće uredbe te Zakonu o elektroničkim
              komunikacijama, za korištenje kolačića nam treba Vaša privola,
              osim ako se radi o nužnim kolačićima. Općenito, ako ste dali
              privolu, možete u bilo kojem trenutku promijeniti ili povući svoju
              privolu za korištenje kolačića., key: -1343a77a
