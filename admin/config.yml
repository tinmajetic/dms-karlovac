          - hint: >-
              Original text: Što su kolačići i za što ih koristimo?, key:
              165b581b
            label: Text
            name: 165b581b
            widget: string
          - hint: 'Original text: ‍, key: 200d'
            label: Text
            name: 200d
            widget: string
          - hint: >-
              Original text: Kolačići su male datoteke koje se sastoje od slova
              i brojeva koje se preuzimaju na Vaše računalo ili mobilni uređaj
              kad posjetite internetske stranice. Pohranjuju se putem Vašeg
              internetskog preglednika na Vaš uređaj. Kolačići omogućuju
              internetskim stranicama pohranu određenih podataka kako bi se
              omogućilo jednostavnije i brže pregledavanje internetskih
              stranica, omogućavaju Vam efikasnu navigaciju kroz mrežna mjesta,
              pamte Vaše željene postavke i općenito poboljšavaju korisničko
              iskustvo. Treba napomenuti da naš website funkcionira optimalno
              samo ako je omogućeno korištenje kolačića., key: 5eac08f4
            label: Text
            name: 5eac08f4
            widget: text
          - hint: 'Original text: Korištenje kolačića (cookies), key: ea00b5f'
            label: Text
            name: ea00b5f
            widget: string
          - hint: >-
              Original text: Sukladno UREDBI (EU) 2016/679 EUROPSKOG PARLAMENTA
              I VIJEĆA o zaštiti pojedinaca u vezi s obradom osobnih podataka i
              o slobodnom kretanju takvih podataka (Općoj uredbi o zaštiti
              podataka), Zakonu o provedbi Opće uredbe te Zakonu o elektroničkim
              komunikacijama, za korištenje kolačića nam treba Vaša privola,
              osim ako se radi o nužnim kolačićima. Općenito, ako ste dali
              privolu, možete u bilo kojem trenutku promijeniti ili povući svoju
              privolu za korištenje kolačića., key: -1343a77a
            label: Text
            name: '-1343a77a'
            widget: text
          - hint: 'Original text: Vrste kolačića, key: 5e01ae7'
            label: Text
            name: 5e01ae7
            widget: string
          - hint: 'Original text: Kolačići prema trajanju, key: 5a51ebf1'
            label: Text
            name: 5a51ebf1
            widget: string
          - hint: >-
              Original text: • Stalni kolačići - Stalni kolačići ostaju na
              računalu nakon zatvaranja programa internet preglednika. Pomoću
              njih mrežna mjesta pohranjuju podatke, kao što su ime za prijavu i
              lozinka, postavke jezika ili postavke o kolačićima tako da ih ne
              morate ponovno unositi prilikom svakog idućeg posjeta. Stalni
              kolačići mogu ostati na računalu ili mobilnom uređaju danima,
              mjesecima, čak i godinama., key: 1a7c66c5
            label: Text
            name: 1a7c66c5
            widget: text
          - hint: >-
              Original text: • Privremeni kolačići - Privremeni kolačići ili
              kolačići sesije uklanjaju se s računala po zatvaranju internet
              preglednika. Pomoću njih mrežna mjesta pohranjuju privremene
              podatke, poput npr. posljednjih nekoliko stranica koje ste
              otvorili na mrežnom mjestu koje posjećujete., key: 40d01ef1
            label: Text
            name: 40d01ef1
            widget: text
          - hint: 'Original text: Kolačići prema izvoru, key: 4c1a5dff'
            label: Text
            name: 4c1a5dff
            widget: string
          - hint: >-
              Original text: • Kolačići prve strane (first party cookies) -
              Kolačići prve strane koje izdaje mrežno mjesto koje ste posjetili,
              u ovom slučaju, naše mrežno mjesto., key: 567f5c93
            label: Text
            name: 567f5c93
            widget: text
          - hint: >-
              Original text: • Kolačići treće strane (third party cookies)
              -Kolačići trećih strana koje izdaju ostala mrežna mjesta. Nemamo
              kontrolu nad takvim kolačićima. Potrebno je provjeriti
              odgovarajuća pravila o privatnosti tih trećih strana. , key:
              -366956ca
            label: Text
            name: '-366956ca'
            widget: text
          - hint: 'Original text: Kolačići prema funkciji, key: 60f21703'
            label: Text
            name: 60f21703
            widget: string
          - hint: >-
              Original text: • Tehnički (nužni) kolačići – uvijek su aktivni.
              Omogućuju osnovne funkcionalnosti poput sigurnosti, upravljanja
              mrežom i pristupačnosti. Svoj preglednik možete postaviti da
              blokira te kolačiće, ali u tom slučaju neki dijelovi stranice neće
              raditi., key: 5d70dc90
            label: Text
            name: 5d70dc90
            widget: text
          - hint: >-
              Original text: • Analitički kolačići – mogu se blokirati.
              Omogućuju mrežnom mjestu praćenje analitike posjetitelja, tj.
              analiziranje načina upotrebe mrežnog mjesta, informaciju o broju
              posjetitelja te dobivanje informacija o načinu poboljšanja mrežnog
              mjesta. Možemo ih postaviti mi ili pružatelji usluga trećih strana
              čije su usluge dodane na naše stranice. Ako ne omogućite te
              kolačiće, neke od tih funkcija možda neće pravilno raditi., key:
              -32293ed6
            label: Text
            name: '-32293ed6'
            widget: text
