          - hint: >-
              Original text: • Stalni kolačići - Stalni kolačići ostaju na
              računalu nakon zatvaranja programa internet preglednika. Pomoću
              njih mrežna mjesta pohranjuju podatke, kao što su ime za prijavu i
              lozinka, postavke jezika ili postavke o kolačićima tako da ih ne
              morate ponovno unositi prilikom svakog idućeg posjeta. Stalni
              kolačići mogu ostati na računalu ili mobilnom uređaju danima,
              mjesecima, čak i godinama., key: 1a7c66c5
            label: Text
            name: 1a7c66c5
            widget: text
          - hint: >-
              Original text: • Privremeni kolačići - Privremeni kolačići ili
